  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  admin:
    profiles:
      - admin
    build:
      context: ./admin
    container_name: gallery-admin
    restart: unless-stopped
    network_mode: "service:admin-tailscale"
    depends_on:
      admin-tailscale:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio.tail877c9f.ts.net:8443}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_BUCKET: ${MINIO_BUCKET:-archive-imgs}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

  admin-tailscale:
    profiles:
      - admin
    container_name: vuongdovu.com-admin-ts
    hostname: archive-admin
    image: tailscale/tailscale:v1.102.5
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - admin_tailscale_state:/var/lib/tailscale
      - ./admin/tailscale/config:/config:ro
    environment:
      TS_HOSTNAME: archive-admin
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/service.json
      TS_AUTHKEY: ${TS_AUTH_KEY:?Set a fresh TS_AUTH_KEY in .env}
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped


volumes:
  postgres_data:
  admin_tailscale_state:
