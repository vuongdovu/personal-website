<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archive admin</title>
    <style>
        :root { font-family: system-ui, sans-serif; color-scheme: light; background: #f5f2ec; color: #242424; }
        body { margin: 0; padding: 2rem 1rem; }
        main { max-width: 52rem; margin: 0 auto; padding: 2rem; background: white; border: 1px solid #ddd5c9; border-radius: 1rem; box-shadow: 0 6px 30px #2b241311; }
        h1 { margin: 0 0 .4rem; font-size: 1.8rem; }
        p { color: #625d56; line-height: 1.5; }
        form { display: grid; gap: 1.2rem; margin-top: 1.5rem; }
        label { display: grid; gap: .4rem; font-weight: 600; }
        input, textarea { font: inherit; border: 1px solid #aaa49b; border-radius: .45rem; padding: .7rem; width: 100%; box-sizing: border-box; background: #fff; color: #242424; }
        textarea { min-height: 7rem; resize: vertical; }
        input[type=file] { padding: .6rem; }
        button { font: inherit; font-weight: 700; color: white; background: #253f35; border: 0; border-radius: .45rem; padding: .85rem 1.2rem; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #preview { display: none; max-width: 100%; max-height: 20rem; object-fit: contain; border-radius: .45rem; }
        #status { margin: 0; min-height: 1.5rem; font-weight: 600; }
        #status.error { color: #ad2935; }
        #status.success { color: #176d3e; }
        small { font-weight: 400; color: #625d56; }
        section { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #ddd5c9; }
        .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        h2 { margin: 0; font-size: 1.35rem; }
        .secondary-button { padding: .55rem .8rem; background: #e6e2da; color: #242424; }
        .post-list { display: grid; gap: .8rem; margin: 1rem 0 0; padding: 0; list-style: none; }
        .post-card { display: flex; align-items: start; gap: 1rem; padding: 1rem; border: 1px solid #ddd5c9; border-radius: .65rem; }
        .post-image { width: 6rem; height: 6rem; flex: none; object-fit: cover; border-radius: .4rem; background: #e6e2da; }
        .post-details { min-width: 0; flex: 1; }
        .post-details h3 { margin: 0 0 .3rem; font-size: 1rem; }
        .post-details p { margin: .2rem 0; overflow-wrap: anywhere; }
        .post-key { font-size: .75rem; }
        .delete-button { flex: none; background: #a72732; padding: .6rem .8rem; }
        #list-status { min-height: 1.5rem; }
        #list-status.error { color: #ad2935; }
        #list-status.success { color: #176d3e; }
        @media (max-width: 35rem) { .post-card { flex-wrap: wrap; } .delete-button { margin-left: auto; } }
    </style>
</head>
<body>
<main>
    <h1>Archive admin</h1>
    <p>Upload photos and manage the posts shown in your archive.</p>
    <form id="upload-form" action="upload" method="post" enctype="multipart/form-data">
        <label for="photo">Photo <small>JPEG, PNG, or WebP; up to 20 MB</small>
            <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic" required>
        </label>
        <img id="preview" alt="Selected photo preview">
        <label for="title">Title
            <input id="title" name="title" type="text" maxlength="200" required>
        </label>
        <label for="caption">Caption
            <textarea id="caption" name="caption" maxlength="2000"></textarea>
        </label>
        <label for="taken-on">Date taken
            <input id="taken-on" name="taken_on" type="date">
        </label>
        <label for="tags">Tags <small>Separate with commas</small>
            <input id="tags" name="tags" type="text" placeholder="travel, family, summer">
        </label>
        <button id="submit" type="submit">Upload photo</button>
        <p id="status" role="status" aria-live="polite"></p>
    </form>
    <section aria-labelledby="live-heading">
        <div class="section-heading">
            <h2 id="live-heading">Live posts <span id="live-count"></span></h2>
            <button id="refresh-posts" class="secondary-button" type="button">Refresh</button>
        </div>
        <p>Pictures currently in the MinIO bucket and shown in the public archive.</p>
        <p id="list-status" role="status" aria-live="polite"></p>
        <ul id="live-posts" class="post-list"></ul>
    </section>
    <section id="missing-section" aria-labelledby="missing-heading" hidden>
        <h2 id="missing-heading">Records missing an image</h2>
        <p>These database entries are not visible in the archive because their MinIO files are missing.</p>
        <ul id="missing-posts" class="post-list"></ul>
    </section>
</main>
<script>
    const form = document.querySelector('#upload-form');
    const fileInput = document.querySelector('#photo');
    const preview = document.querySelector('#preview');
    const status = document.querySelector('#status');
    const submit = document.querySelector('#submit');
    let previewUrl;
    const liveList = document.querySelector('#live-posts');
    const missingList = document.querySelector('#missing-posts');
    const missingSection = document.querySelector('#missing-section');
    const liveCount = document.querySelector('#live-count');
    const listStatus = document.querySelector('#list-status');
    const refreshButton = document.querySelector('#refresh-posts');

    function makePost(post, missing) {
        const card = document.createElement('li');
        card.className = 'post-card';
        if (!missing) {
            const image = document.createElement('img');
            image.className = 'post-image';
            image.alt = post.title;
            image.loading = 'lazy';
            image.src = `preview?object_key=${encodeURIComponent(post.object_key)}`;
            card.append(image);
        }
        const details = document.createElement('div');
        details.className = 'post-details';
        const title = document.createElement('h3');
        title.textContent = post.title;
        const date = document.createElement('p');
        date.textContent = `Date: ${post.taken_on || post.created_at.slice(0, 10)}`;
        const key = document.createElement('p');
        key.className = 'post-key';
        key.textContent = post.object_key;
        details.append(title, date);
        if (post.caption) {
            const caption = document.createElement('p');
            caption.textContent = post.caption;
            details.append(caption);
        }
        if (!missing && !post.has_metadata) {
            const note = document.createElement('p');
            note.textContent = 'No database metadata; archive uses the file date.';
            details.append(note);
        }
        details.append(key);
        card.append(details);

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'delete-button';
        deleteButton.textContent = missing ? 'Remove record' : 'Delete post';
        deleteButton.setAttribute('aria-label', `${deleteButton.textContent} “${post.title}”`);
        deleteButton.addEventListener('click', async () => {
            const action = missing ? 'remove its database record' : 'delete its MinIO image and database record';
            if (!window.confirm(`Permanently ${action} for “${post.title}”?`)) return;
            deleteButton.disabled = true;
            listStatus.className = '';
            listStatus.textContent = `Deleting “${post.title}”…`;
            try {
                const response = await fetch('photos', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ object_key: post.object_key }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || `Delete failed (${response.status})`);
                await loadPosts();
                listStatus.className = 'success';
                listStatus.textContent = `Deleted “${post.title}”.`;
            } catch (error) {
                listStatus.className = 'error';
                listStatus.textContent = error.message || 'Delete failed';
                deleteButton.disabled = false;
            }
        });
        card.append(deleteButton);
        return card;
    }

    async function loadPosts() {
        refreshButton.disabled = true;
        listStatus.className = '';
        listStatus.textContent = 'Loading posts…';
        try {
            const response = await fetch('photos', { cache: 'no-store' });
            const result = await response.json();
            if (!response.ok) throw new Error(result.detail || `Could not load posts (${response.status})`);
            liveList.replaceChildren(...result.live.map((post) => makePost(post, false)));
            missingList.replaceChildren(...result.missing.map((post) => makePost(post, true)));
            missingSection.hidden = result.missing.length === 0;
            liveCount.textContent = `(${result.live.length})`;
            listStatus.textContent = result.live.length ? '' : 'No live posts yet.';
        } catch (error) {
            listStatus.className = 'error';
            listStatus.textContent = error.message || 'Could not load posts';
        } finally {
            refreshButton.disabled = false;
        }
    }

    refreshButton.addEventListener('click', loadPosts);
    loadPosts();

    fileInput.addEventListener('change', () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        const file = fileInput.files[0];
        preview.style.display = file ? 'block' : 'none';
        if (file) {
            previewUrl = URL.createObjectURL(file);
            preview.src = previewUrl;
        }
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.className = '';
        status.textContent = 'Uploading…';
        submit.disabled = true;
        try {
            const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
            const body = await response.text();
            let result;
            if (response.headers.get('content-type')?.includes('application/json')) {
                try { result = JSON.parse(body); } catch { /* Show the raw response below. */ }
            }
            if (!response.ok) {
                const detail = typeof result?.detail === 'string'
                    ? result.detail
                    : body.startsWith('<') ? 'The server returned an HTML error page.' : body.slice(0, 200);
                const source = response.headers.get('x-archive-admin') === '1'
                    ? ''
                    : ' The response did not come from the admin app; check the upload URL and Tailscale Serve route.';
                throw new Error(`Upload failed (${response.status}) at ${response.url}: ${detail || response.statusText}${source}`);
            }
            if (!result) throw new Error(`Upload returned an unexpected response from ${response.url}`);
            status.className = 'success';
            status.textContent = `Saved “${result.title}” successfully.`;
            form.reset();
            preview.style.display = 'none';
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            await loadPosts();
        } catch (error) {
            status.className = 'error';
            status.textContent = error.message || 'Upload failed';
        } finally {
            submit.disabled = false;
        }
    });
</script>
</body>
</html>
